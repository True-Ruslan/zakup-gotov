name: zakup-gotov

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: zakup_gotov
      POSTGRES_USER: zakup_gotov
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - zakup-gotov-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zakup_gotov -d zakup_gotov"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  api:
    image: ${API_IMAGE:?API_IMAGE must be set}
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/zakup_gotov
      DATABASE_USERNAME: zakup_gotov
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE must be set}
    environment:
      API_BASE_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "Promise.all([fetch('http://127.0.0.1:3000/'), fetch(new URL('/api/v1/system', process.env.API_BASE_URL))]).then(rs => { if (rs.some(r => !r.ok)) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  zakup-gotov-postgres:
