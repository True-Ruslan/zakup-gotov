openapi: 3.1.0
info:
  title: Zakup Gotov API
  version: 0.0.0
paths:
  /api/v1/system:
    get:
      operationId: getSystemInfo
      summary: Get product API availability information
      responses:
        '200':
          description: API availability information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
  /api/v1/retailers:
    get:
      operationId: getRetailerReadiness
      summary: Get canonical retailer coverage and comparison readiness
      responses:
        '200':
          description: Canonical retailer readiness information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetailerReadinessResponse'
  /api/v1/comparison-previews:
    post:
      operationId: createComparisonPreview
      summary: Create a transient locality-based basket comparison preview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComparisonPreviewRequest'
      responses:
        '200':
          description: Product-safe comparison preview for all canonical retailers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonPreviewResponse'
        '400':
          description: Invalid comparison preview request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvalidComparisonPreviewProblem'
  /api/v1/recipe-shopping-previews:
    post:
      operationId: createRecipeShoppingPreview
      summary: Convert a transient recipe request into a canonical shopping-list preview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeShoppingPreviewRequest'
      responses:
        '200':
          description: Canonical Recipe to ShoppingList conversion preview with ingredient provenance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeShoppingPreviewResponse'
        '400':
          description: Invalid recipe shopping preview request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvalidRecipeShoppingPreviewProblem'
  /api/v1/recipe-comparison-previews:
    post:
      operationId: createRecipeComparisonPreview
      summary: Create a transient recipe-to-retailer comparison preview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeComparisonPreviewRequest'
      responses:
        '200':
          description: Composed recipe shopping and retailer comparison preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeComparisonPreviewResponse'
        '400':
          description: Invalid recipe comparison preview request
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/InvalidRecipeComparisonPreviewProblem'
                  - $ref: '#/components/schemas/InvalidRecipeShoppingPreviewProblem'
                  - $ref: '#/components/schemas/InvalidComparisonPreviewProblem'
  /api/v1/weekly-plan-shopping-previews:
    post:
      operationId: createWeeklyPlanShoppingPreview
      summary: Create a transient weekly-plan shopping-list preview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeeklyPlanShoppingPreviewRequest'
      responses:
        '200':
          description: Canonical WeeklyPlan shopping preview with self-contained occurrence and Recipe provenance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyPlanShoppingPreviewResponse'
        '400':
          description: Invalid weekly plan shopping preview request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvalidWeeklyPlanShoppingPreviewProblem'
  /api/v1/weekly-plan-pantry-shopping-previews:
    post:
      operationId: createWeeklyPlanPantryShoppingPreview
      summary: Create a transient Pantry-aware weekly-plan shopping preview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeeklyPlanPantryShoppingPreviewRequest'
      responses:
        '200':
          description: Original WeeklyPlan shopping projection, Pantry adjustment evidence and remaining shopping projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyPlanPantryShoppingPreview'
        '400':
          description: Invalid Pantry-aware weekly plan shopping preview request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvalidWeeklyPlanPantryShoppingPreviewProblem'
  /api/v1/weekly-plan-pantry-comparison-previews:
    post:
      operationId: createWeeklyPlanPantryComparisonPreview
      summary: Create a transient Pantry-aware weekly-plan-to-retailer comparison preview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeeklyPlanPantryComparisonPreviewRequest'
      responses:
        '200':
          description: Pantry-aware WeeklyPlan shopping audit with explicit comparison outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyPlanPantryComparisonPreview'
        '400':
          description: Invalid Pantry-aware weekly plan comparison preview request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvalidWeeklyPlanPantryComparisonPreviewProblem'
  /api/v1/weekly-plan-comparison-previews:
    post:
      operationId: createWeeklyPlanComparisonPreview
      summary: Create a transient weekly-plan-to-retailer comparison preview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeeklyPlanComparisonPreviewRequest'
      responses:
        '200':
          description: Composed WeeklyPlan shopping and retailer comparison preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyPlanComparisonPreview'
        '400':
          description: Invalid weekly plan comparison preview request
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/InvalidWeeklyPlanComparisonPreviewProblem'
                  - $ref: '#/components/schemas/InvalidWeeklyPlanShoppingPreviewProblem'
                  - $ref: '#/components/schemas/InvalidComparisonPreviewProblem'
components:
  schemas:
    SystemInfo:
      type: object
      additionalProperties: false
      required:
        - name
        - status
      properties:
        name:
          type: string
          const: zakup-gotov-api
        status:
          type: string
          enum:
            - UP
    RetailerReadinessResponse:
      type: object
      additionalProperties: false
      required:
        - retailers
      properties:
        retailers:
          type: array
          items:
            $ref: '#/components/schemas/RetailerReadinessItem'
    RetailerReadinessItem:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - coverage
        - productionAccess
        - comparisonStatus
        - reasons
      properties:
        id:
          $ref: '#/components/schemas/RetailerId'
        displayName:
          type: string
          minLength: 1
        coverage:
          $ref: '#/components/schemas/RetailerCoverageStatus'
        productionAccess:
          $ref: '#/components/schemas/RetailerProductionAccessStatus'
        comparisonStatus:
          $ref: '#/components/schemas/RetailerComparisonStatus'
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/RetailerComparisonReason'
        total:
          $ref: '#/components/schemas/BasketTotal'
        freshness:
          $ref: '#/components/schemas/RetailerFreshness'
    ComparisonPreviewRequest:
      type: object
      additionalProperties: false
      required:
        - locality
        - items
      properties:
        locality:
          type: string
          minLength: 1
          maxLength: 160
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ComparisonPreviewRequestItem'
    ComparisonPreviewRequestItem:
      type: object
      additionalProperties: false
      required:
        - id
        - requirement
        - quantity
      properties:
        id:
          type: string
          format: uuid
        requirement:
          type: string
          minLength: 1
          maxLength: 240
        quantity:
          $ref: '#/components/schemas/ComparisonPreviewQuantityInput'
    ComparisonPreviewQuantityInput:
      type: object
      additionalProperties: false
      required:
        - amount
        - unit
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
        unit:
          $ref: '#/components/schemas/QuantityInputUnit'
    RecipeShoppingPreviewRequest:
      type: object
      additionalProperties: false
      required:
        - title
        - baseServings
        - targetServings
        - ingredients
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 240
        baseServings:
          type: integer
          minimum: 1
        targetServings:
          type: integer
          minimum: 1
        ingredients:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/RecipeShoppingPreviewIngredientInput'
    RecipeShoppingPreviewIngredientInput:
      type: object
      additionalProperties: false
      required:
        - requirement
        - quantity
      properties:
        requirement:
          type: string
          minLength: 1
          maxLength: 240
        quantity:
          type: object
          additionalProperties: false
          required:
            - amount
            - unit
          properties:
            amount:
              type: number
              exclusiveMinimum: 0
            unit:
              $ref: '#/components/schemas/QuantityInputUnit'
    RecipeComparisonPreviewRequest:
      type: object
      additionalProperties: false
      required:
        - locality
        - recipe
      properties:
        locality:
          type: string
          minLength: 1
          maxLength: 160
        recipe:
          $ref: '#/components/schemas/RecipeShoppingPreviewRequest'
    WeeklyPlanComparisonPreviewRequest:
      type: object
      additionalProperties: false
      required:
        - locality
        - weeklyPlan
      properties:
        locality:
          type: string
          minLength: 1
          maxLength: 160
        weeklyPlan:
          $ref: '#/components/schemas/WeeklyPlanShoppingPreviewRequest'
    WeeklyPlanPantryComparisonPreviewRequest:
      type: object
      additionalProperties: false
      required:
        - locality
        - weeklyPlan
        - pantry
      properties:
        locality:
          type: string
          minLength: 1
          maxLength: 160
        weeklyPlan:
          $ref: '#/components/schemas/WeeklyPlanShoppingPreviewRequest'
        pantry:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyPlanPantryItemInput'
    QuantityInputUnit:
      type: string
      enum:
        - PIECE
        - GRAM
        - KILOGRAM
        - MILLILITER
        - LITER
    CanonicalQuantity:
      type: object
      additionalProperties: false
      required:
        - amount
        - unit
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
        unit:
          $ref: '#/components/schemas/CanonicalQuantityUnit'
    CanonicalQuantityUnit:
      type: string
      enum:
        - PIECE
        - GRAM
        - MILLILITER
    RecipeShoppingPreviewResponse:
      type: object
      additionalProperties: false
      required:
        - recipe
        - shoppingList
      properties:
        recipe:
          $ref: '#/components/schemas/RecipeShoppingPreviewRecipe'
        shoppingList:
          $ref: '#/components/schemas/RecipeShoppingPreviewShoppingList'
    RecipeComparisonPreviewResponse:
      type: object
      additionalProperties: false
      required:
        - recipeShoppingPreview
        - comparisonPreview
      properties:
        recipeShoppingPreview:
          $ref: '#/components/schemas/RecipeShoppingPreviewResponse'
        comparisonPreview:
          $ref: '#/components/schemas/ComparisonPreviewResponse'
    RecipeShoppingPreviewRecipe:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - baseServings
        - targetServings
        - ingredients
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 240
        baseServings:
          type: integer
          minimum: 1
        targetServings:
          type: integer
          minimum: 1
        ingredients:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/RecipeShoppingPreviewRecipeIngredient'
    RecipeShoppingPreviewRecipeIngredient:
      type: object
      additionalProperties: false
      required:
        - id
        - requirement
        - quantity
      properties:
        id:
          type: string
          format: uuid
        requirement:
          type: string
          minLength: 1
          maxLength: 240
        quantity:
          $ref: '#/components/schemas/CanonicalQuantity'
    RecipeShoppingPreviewShoppingList:
      type: object
      additionalProperties: false
      required:
        - id
        - items
      properties:
        id:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/RecipeShoppingPreviewShoppingItem'
    RecipeShoppingPreviewShoppingItem:
      type: object
      additionalProperties: false
      required:
        - id
        - requirement
        - quantity
        - sourceIngredientIds
      properties:
        id:
          type: string
          format: uuid
        requirement:
          type: string
          minLength: 1
          maxLength: 240
        quantity:
          $ref: '#/components/schemas/CanonicalQuantity'
        sourceIngredientIds:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid
    ComparisonPreviewResponse:
      type: object
      additionalProperties: false
      required:
        - locality
        - items
        - retailers
      properties:
        locality:
          type: string
          minLength: 1
          maxLength: 160
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ComparisonPreviewRequestedItem'
        retailers:
          type: array
          minItems: 8
          maxItems: 8
          items:
            $ref: '#/components/schemas/ComparisonPreviewRetailer'
    ComparisonPreviewRequestedItem:
      type: object
      additionalProperties: false
      required:
        - id
        - requirement
        - quantity
      properties:
        id:
          type: string
          format: uuid
        requirement:
          type: string
          minLength: 1
        quantity:
          $ref: '#/components/schemas/CanonicalQuantity'
    ComparisonPreviewRetailer:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - coverage
        - productionAccess
        - comparisonStatus
        - reasons
        - items
      properties:
        id:
          $ref: '#/components/schemas/RetailerId'
        displayName:
          type: string
          minLength: 1
        coverage:
          $ref: '#/components/schemas/RetailerCoverageStatus'
        productionAccess:
          $ref: '#/components/schemas/RetailerProductionAccessStatus'
        comparisonStatus:
          $ref: '#/components/schemas/RetailerComparisonStatus'
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/RetailerComparisonReason'
        total:
          $ref: '#/components/schemas/BasketTotal'
        freshness:
          $ref: '#/components/schemas/RetailerFreshness'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ComparisonPreviewItem'
    ComparisonPreviewItem:
      type: object
      additionalProperties: false
      required:
        - id
        - requirement
        - requestedQuantity
        - status
        - candidateProductNames
      properties:
        id:
          type: string
          format: uuid
        requirement:
          type: string
          minLength: 1
        requestedQuantity:
          $ref: '#/components/schemas/CanonicalQuantity'
        status:
          $ref: '#/components/schemas/BasketItemResolutionStatus'
        candidateProductNames:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
        selection:
          $ref: '#/components/schemas/ComparisonPreviewSelection'
    ComparisonPreviewSelection:
      type: object
      additionalProperties: false
      required:
        - productName
        - packageQuantity
        - packageCount
        - coveredQuantity
        - lineTotal
        - currencyCode
      properties:
        productName:
          type: string
          minLength: 1
        packageQuantity:
          $ref: '#/components/schemas/CanonicalQuantity'
        packageCount:
          type: integer
          minimum: 1
        coveredQuantity:
          $ref: '#/components/schemas/CanonicalQuantity'
        lineTotal:
          type: number
          minimum: 0
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
    BasketItemResolutionStatus:
      type: string
      enum:
        - FULFILLED
        - AVAILABILITY_UNKNOWN
        - UNMATCHED
        - AMBIGUOUS
        - UNAVAILABLE
        - PACKAGE_QUANTITY_UNKNOWN
        - QUANTITY_UNIT_MISMATCH
    InvalidComparisonPreviewProblem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - errors
      properties:
        type:
          type: string
          const: https://zakup-gotov.dev/problems/invalid-comparison-preview
        title:
          type: string
          const: Invalid comparison preview request
        status:
          type: integer
          const: 400
        code:
          type: string
          const: INVALID_COMPARISON_PREVIEW
        errors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ComparisonPreviewValidationError'
    ComparisonPreviewValidationError:
      type: object
      additionalProperties: false
      required:
        - field
        - message
      properties:
        field:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
    InvalidRecipeShoppingPreviewProblem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - errors
      properties:
        type:
          type: string
          const: https://zakup-gotov.dev/problems/invalid-recipe-shopping-preview
        title:
          type: string
          const: Invalid recipe shopping preview request
        status:
          type: integer
          const: 400
        code:
          type: string
          const: INVALID_RECIPE_SHOPPING_PREVIEW
        errors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RecipeShoppingPreviewValidationError'
    RecipeShoppingPreviewValidationError:
      type: object
      additionalProperties: false
      required:
        - field
        - message
      properties:
        field:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
    InvalidRecipeComparisonPreviewProblem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - errors
      properties:
        type:
          type: string
          const: https://zakup-gotov.dev/problems/invalid-recipe-comparison-preview
        title:
          type: string
          const: Invalid recipe comparison preview request
        status:
          type: integer
          const: 400
        code:
          type: string
          const: INVALID_RECIPE_COMPARISON_PREVIEW
        errors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RecipeComparisonPreviewValidationError'
    RecipeComparisonPreviewValidationError:
      type: object
      additionalProperties: false
      required:
        - field
        - message
      properties:
        field:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
    WeeklyPlanShoppingPreviewRequest:
      type: object
      additionalProperties: false
      required:
        - occurrences
      properties:
        occurrences:
          type: array
          minItems: 1
          maxItems: 35
          items:
            $ref: '#/components/schemas/WeeklyPlanShoppingPreviewOccurrenceInput'
    WeeklyPlanPantryShoppingPreviewRequest:
      type: object
      additionalProperties: false
      required:
        - weeklyPlan
        - pantry
      properties:
        weeklyPlan:
          $ref: '#/components/schemas/WeeklyPlanShoppingPreviewRequest'
        pantry:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyPlanPantryItemInput'
    WeeklyPlanPantryItemInput:
      type: object
      additionalProperties: false
      required:
        - requirement
        - quantity
      properties:
        requirement:
          type: string
          minLength: 1
          maxLength: 240
        quantity:
          $ref: '#/components/schemas/WeeklyPlanPantryQuantityInput'
    WeeklyPlanPantryQuantityInput:
      type: object
      additionalProperties: false
      required:
        - amount
        - unit
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
        unit:
          $ref: '#/components/schemas/QuantityInputUnit'
    WeeklyPlanShoppingPreviewOccurrenceInput:
      type: object
      additionalProperties: false
      required:
        - day
        - targetServings
        - recipe
      properties:
        day:
          $ref: '#/components/schemas/WeeklyPlanDay'
        targetServings:
          type: integer
          minimum: 1
        recipe:
          $ref: '#/components/schemas/WeeklyPlanShoppingPreviewRecipeInput'
    WeeklyPlanShoppingPreviewRecipeInput:
      type: object
      additionalProperties: false
      required:
        - title
        - baseServings
        - ingredients
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 240
        baseServings:
          type: integer
          minimum: 1
        ingredients:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/RecipeShoppingPreviewIngredientInput'
    WeeklyPlanDay:
      type: string
      enum:
        - MONDAY
        - TUESDAY
        - WEDNESDAY
        - THURSDAY
        - FRIDAY
        - SATURDAY
        - SUNDAY
    WeeklyPlanShoppingPreviewResponse:
      type: object
      additionalProperties: false
      required:
        - weeklyPlan
        - shoppingList
      properties:
        weeklyPlan:
          $ref: '#/components/schemas/WeeklyPlanShoppingPreviewPlan'
        shoppingList:
          $ref: '#/components/schemas/WeeklyPlanShoppingPreviewShoppingList'
    WeeklyPlanPantryShoppingPreview:
      type: object
      additionalProperties: false
      required:
        - weeklyPlan
        - originalShoppingList
        - pantryAdjustments
        - remainingShoppingList
      properties:
        weeklyPlan:
          $ref: '#/components/schemas/WeeklyPlanShoppingPreviewPlan'
        originalShoppingList:
          $ref: '#/components/schemas/WeeklyPlanShoppingPreviewShoppingList'
        pantryAdjustments:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WeeklyPlanPantryAdjustmentEvidence'
        remainingShoppingList:
          $ref: '#/components/schemas/WeeklyPlanPantryRemainingShoppingList'
    WeeklyPlanPantryAdjustmentEvidence:
      type: object
      additionalProperties: false
      required:
        - itemId
        - requirement
        - required
        - status
      properties:
        itemId:
          type: string
          format: uuid
        requirement:
          type: string
          minLength: 1
          maxLength: 240
        required:
          $ref: '#/components/schemas/CanonicalQuantity'
        pantryUsed:
          $ref: '#/components/schemas/CanonicalQuantity'
        remaining:
          $ref: '#/components/schemas/CanonicalQuantity'
        status:
          $ref: '#/components/schemas/PantryAdjustmentStatus'
    PantryAdjustmentStatus:
      type: string
      enum:
        - UNCHANGED
        - PARTIALLY_COVERED
        - FULLY_COVERED
    WeeklyPlanPantryRemainingShoppingList:
      type: object
      additionalProperties: false
      required:
        - id
        - items
      properties:
        id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyPlanShoppingPreviewShoppingItem'
    WeeklyPlanPantryComparisonPreview:
      type: object
      additionalProperties: false
      required:
        - pantryShoppingPreview
        - comparisonOutcome
      properties:
        pantryShoppingPreview:
          $ref: '#/components/schemas/WeeklyPlanPantryShoppingPreview'
        comparisonOutcome:
          $ref: '#/components/schemas/WeeklyPlanPantryComparisonOutcome'
        comparisonPreview:
          $ref: '#/components/schemas/ComparisonPreviewResponse'
      description: comparisonPreview is present only when comparisonOutcome is COMPARED.
    WeeklyPlanPantryComparisonOutcome:
      type: string
      enum:
        - COMPARED
        - NO_REMAINING_DEMAND
    WeeklyPlanComparisonPreview:
      type: object
      additionalProperties: false
      required:
        - weeklyPlanShoppingPreview
        - comparisonPreview
      properties:
        weeklyPlanShoppingPreview:
          $ref: '#/components/schemas/WeeklyPlanShoppingPreviewResponse'
        comparisonPreview:
          $ref: '#/components/schemas/ComparisonPreviewResponse'
    WeeklyPlanShoppingPreviewPlan:
      type: object
      additionalProperties: false
      required:
        - id
        - occurrences
      properties:
        id:
          type: string
          format: uuid
        occurrences:
          type: array
          minItems: 1
          maxItems: 35
          items:
            $ref: '#/components/schemas/WeeklyPlanShoppingPreviewOccurrence'
    WeeklyPlanShoppingPreviewOccurrence:
      type: object
      additionalProperties: false
      required:
        - id
        - day
        - targetServings
        - recipe
      properties:
        id:
          type: string
          format: uuid
        day:
          $ref: '#/components/schemas/WeeklyPlanDay'
        targetServings:
          type: integer
          minimum: 1
        recipe:
          $ref: '#/components/schemas/WeeklyPlanShoppingPreviewRecipe'
    WeeklyPlanShoppingPreviewRecipe:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - baseServings
        - ingredients
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 240
        baseServings:
          type: integer
