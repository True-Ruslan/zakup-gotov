openapi: 3.1.0
info:
  title: Zakup Gotov API
  version: 0.0.0
paths:
  /api/v1/system:
    get:
      operationId: getSystemInfo
      summary: Get product API availability information
      responses:
        '200':
          description: API availability information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
  /api/v1/retailers:
    get:
      operationId: getRetailerReadiness
      summary: Get canonical retailer coverage and comparison readiness
      responses:
        '200':
          description: Canonical retailer readiness information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetailerReadinessResponse'
  /api/v1/comparison-previews:
    post:
      operationId: createComparisonPreview
      summary: Create a transient locality-based basket comparison preview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComparisonPreviewRequest'
      responses:
        '200':
          description: Product-safe comparison preview for all canonical retailers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonPreviewResponse'
        '400':
          description: Invalid comparison preview request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvalidComparisonPreviewProblem'
components:
  schemas:
    SystemInfo:
      type: object
      additionalProperties: false
      required:
        - name
        - status
      properties:
        name:
          type: string
          const: zakup-gotov-api
        status:
          type: string
          enum:
            - UP
    RetailerReadinessResponse:
      type: object
      additionalProperties: false
      required:
        - retailers
      properties:
        retailers:
          type: array
          items:
            $ref: '#/components/schemas/RetailerReadinessItem'
    RetailerReadinessItem:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - coverage
        - productionAccess
        - comparisonStatus
        - reasons
      properties:
        id:
          $ref: '#/components/schemas/RetailerId'
        displayName:
          type: string
          minLength: 1
        coverage:
          $ref: '#/components/schemas/RetailerCoverageStatus'
        productionAccess:
          $ref: '#/components/schemas/RetailerProductionAccessStatus'
        comparisonStatus:
          $ref: '#/components/schemas/RetailerComparisonStatus'
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/RetailerComparisonReason'
        total:
          $ref: '#/components/schemas/BasketTotal'
        freshness:
          $ref: '#/components/schemas/RetailerFreshness'
    ComparisonPreviewRequest:
      type: object
      additionalProperties: false
      required:
        - locality
        - items
      properties:
        locality:
          type: string
          minLength: 1
          maxLength: 160
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ComparisonPreviewRequestItem'
    ComparisonPreviewRequestItem:
      type: object
      additionalProperties: false
      required:
        - id
        - requirement
        - quantity
      properties:
        id:
          type: string
          format: uuid
        requirement:
          type: string
          minLength: 1
          maxLength: 240
        quantity:
          $ref: '#/components/schemas/ComparisonPreviewQuantityInput'
    ComparisonPreviewQuantityInput:
      type: object
      additionalProperties: false
      required:
        - amount
        - unit
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
        unit:
          $ref: '#/components/schemas/QuantityInputUnit'
    QuantityInputUnit:
      type: string
      enum:
        - PIECE
        - GRAM
        - KILOGRAM
        - MILLILITER
        - LITER
    CanonicalQuantity:
      type: object
      additionalProperties: false
      required:
        - amount
        - unit
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
        unit:
          $ref: '#/components/schemas/CanonicalQuantityUnit'
    CanonicalQuantityUnit:
      type: string
      enum:
        - PIECE
        - GRAM
        - MILLILITER
    ComparisonPreviewResponse:
      type: object
      additionalProperties: false
      required:
        - locality
        - items
        - retailers
      properties:
        locality:
          type: string
          minLength: 1
          maxLength: 160
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ComparisonPreviewRequestedItem'
        retailers:
          type: array
          minItems: 8
          maxItems: 8
          items:
            $ref: '#/components/schemas/ComparisonPreviewRetailer'
    ComparisonPreviewRequestedItem:
      type: object
      additionalProperties: false
      required:
        - id
        - requirement
        - quantity
      properties:
        id:
          type: string
          format: uuid
        requirement:
          type: string
          minLength: 1
        quantity:
          $ref: '#/components/schemas/CanonicalQuantity'
    ComparisonPreviewRetailer:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - coverage
        - productionAccess
        - comparisonStatus
        - reasons
        - items
      properties:
        id:
          $ref: '#/components/schemas/RetailerId'
        displayName:
          type: string
          minLength: 1
        coverage:
          $ref: '#/components/schemas/RetailerCoverageStatus'
        productionAccess:
          $ref: '#/components/schemas/RetailerProductionAccessStatus'
        comparisonStatus:
          $ref: '#/components/schemas/RetailerComparisonStatus'
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/RetailerComparisonReason'
        total:
          $ref: '#/components/schemas/BasketTotal'
        freshness:
          $ref: '#/components/schemas/RetailerFreshness'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ComparisonPreviewItem'
    ComparisonPreviewItem:
      type: object
      additionalProperties: false
      required:
        - id
        - requirement
        - requestedQuantity
        - status
        - candidateProductNames
      properties:
        id:
          type: string
          format: uuid
        requirement:
          type: string
          minLength: 1
        requestedQuantity:
          $ref: '#/components/schemas/CanonicalQuantity'
        status:
          $ref: '#/components/schemas/BasketItemResolutionStatus'
        candidateProductNames:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
        selection:
          $ref: '#/components/schemas/ComparisonPreviewSelection'
    ComparisonPreviewSelection:
      type: object
      additionalProperties: false
      required:
        - productName
        - packageQuantity
        - packageCount
        - coveredQuantity
        - lineTotal
        - currencyCode
      properties:
        productName:
          type: string
          minLength: 1
        packageQuantity:
          $ref: '#/components/schemas/CanonicalQuantity'
        packageCount:
          type: integer
          minimum: 1
        coveredQuantity:
          $ref: '#/components/schemas/CanonicalQuantity'
        lineTotal:
          type: number
          minimum: 0
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
    BasketItemResolutionStatus:
      type: string
      enum:
        - FULFILLED
        - AVAILABILITY_UNKNOWN
        - UNMATCHED
        - AMBIGUOUS
        - UNAVAILABLE
        - PACKAGE_QUANTITY_UNKNOWN
        - QUANTITY_UNIT_MISMATCH
    InvalidComparisonPreviewProblem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - errors
      properties:
        type:
          type: string
          const: https://zakup-gotov.dev/problems/invalid-comparison-preview
        title:
          type: string
          const: Invalid comparison preview request
        status:
          type: integer
          const: 400
        code:
          type: string
          const: INVALID_COMPARISON_PREVIEW
        errors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ComparisonPreviewValidationError'
    ComparisonPreviewValidationError:
      type: object
      additionalProperties: false
      required:
        - field
        - message
      properties:
        field:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
    RetailerId:
      type: string
      enum:
        - pyaterochka
        - perekrestok
        - chizhik
        - magnit
        - lenta
        - vkusvill
        - ozon-fresh
        - samokat
    RetailerCoverageStatus:
      type: string
      enum:
        - CONNECTED
        - DISCOVERY
        - DEGRADED
        - BLOCKED
    RetailerProductionAccessStatus:
      type: string
      enum:
        - READY
        - PENDING
        - BLOCKED
    RetailerComparisonStatus:
      type: string
      enum:
        - READY
        - UNCERTAIN
        - INCOMPLETE
        - UNAVAILABLE
    RetailerComparisonReason:
      type: string
      enum:
        - COVERAGE_DISCOVERY
        - COVERAGE_DEGRADED
        - COVERAGE_BLOCKED
        - PRODUCTION_ACCESS_PENDING
        - PRODUCTION_ACCESS_BLOCKED
        - DATA_NOT_AVAILABLE
        - SOURCE_UNAVAILABLE
        - ITEM_UNMATCHED
        - ITEM_AMBIGUOUS
        - ITEM_UNAVAILABLE
        - PACKAGE_QUANTITY_UNKNOWN
        - QUANTITY_UNIT_MISMATCH
        - AVAILABILITY_UNKNOWN
    BasketTotal:
      type: object
      additionalProperties: false
      required:
        - amount
        - currencyCode
      properties:
        amount:
          type: number
          minimum: 0
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
    RetailerFreshness:
      type: object
      additionalProperties: false
      required:
        - basis
        - observedAt
      properties:
        basis:
          $ref: '#/components/schemas/RetailerFreshnessBasis'
        observedAt:
          type: string
          format: date-time
        providerUpdatedAt:
          type: string
          format: date-time
    RetailerFreshnessBasis:
      type: string
      enum:
        - OBSERVATION_ONLY
        - PROVIDER_TIMESTAMP
