name: Retailer Bridge CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Retailer Bridge CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.4.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run bridge tests
        run: pnpm --dir apps/retailer-bridge test

      - name: Typecheck bridge
        run: pnpm --dir apps/retailer-bridge typecheck

      - name: Build bridge
        run: pnpm --dir apps/retailer-bridge build

      - name: Install Playwright Chromium
        run: pnpm --dir apps/retailer-bridge exec playwright install --with-deps chromium

      - name: Run bridge Chromium E2E
        run: pnpm --dir apps/retailer-bridge test:e2e
