name: M3.5.4 Acceptance Cleanup

on:
  push:
    branches:
      - docs/m3-5-4-responsive-pantry-controls-acceptance

permissions:
  contents: write

jobs:
  cleanup-acceptance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Clean canonical docs
        run: |
          python - <<'PY'
          from pathlib import Path

          state_path = Path('docs/PROJECT_STATE.md')
          state = state_path.read_text(encoding='utf-8')
          duplicate = 'Explicit omit-all / never-buy exclusions remain a separate future semantic decision rather than being encoded as zero/negative Pantry quantities.\n\n'
          if state.count(duplicate) != 1:
              raise SystemExit(f'PROJECT_STATE deferred marker count={state.count(duplicate)}')
          state_path.write_text(state.replace(duplicate, '', 1), encoding='utf-8')

          roadmap_path = Path('docs/ROADMAP.md')
          roadmap = roadmap_path.read_text(encoding='utf-8')
          old = 'Continue without blocking deterministic M3 work unless evidence invalidates accepted core assumptions:'
          new = 'Continue without blocking deterministic M4 work unless evidence invalidates accepted core assumptions:'
          if roadmap.count(old) != 1:
              raise SystemExit(f'ROADMAP parallel-work marker count={roadmap.count(old)}')
          roadmap_path.write_text(roadmap.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit cleanup when changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATE.md docs/ROADMAP.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(m3): clean M3.5.4 canonical acceptance"
          git push
