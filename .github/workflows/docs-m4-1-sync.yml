name: Temporary M4.1 Acceptance Docs Sync

on:
  push:
    branches:
      - docs/m4-1-basket-economics-acceptance
    paths:
      - .github/workflows/docs-m4-1-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out docs branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/m4-1-basket-economics-acceptance

      - name: Synchronize canonical docs
        run: python .github/scripts/sync_m4_1_acceptance.py

      - name: Commit canonical docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATE.md docs/ROADMAP.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No canonical docs changes to commit"
            exit 0
          fi
          git commit -m "docs(m4): synchronize basket economics acceptance"
          git push origin HEAD:docs/m4-1-basket-economics-acceptance
