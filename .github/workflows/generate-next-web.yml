name: Generate Next.js Web Scaffold

on:
  pull_request:
    paths:
      - ".github/workflows/generate-next-web.yml"

permissions:
  contents: write

jobs:
  generate:
    if: github.repository == 'True-Ruslan/zakup-gotov' && github.head_ref == 'feat/m0a-web-shell'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v6
        with:
          ref: feat/m0a-web-shell

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.4.0

      - name: Generate Next.js 16.2 scaffold
        run: |
          pnpm dlx create-next-app@16.2.0 apps/web \
            --ts \
            --eslint \
            --tailwind \
            --app \
            --src-dir \
            --import-alias "@/*" \
            --use-pnpm \
            --skip-install \
            --disable-git \
            --yes

      - name: Link shared API client and install workspace
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'apps/web/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.dependencies = pkg.dependencies || {};
          pkg.dependencies['@zakup-gotov/api-client'] = 'workspace:*';
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          pnpm install --no-frozen-lockfile

      - name: Commit generated scaffold
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore: generate Next.js web scaffold"
          git push origin HEAD:feat/m0a-web-shell
