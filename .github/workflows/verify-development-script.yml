name: Verify Development Script

on:
  pull_request:
    paths:
      - ".github/workflows/verify-development-script.yml"

permissions:
  contents: write

jobs:
  verify:
    if: github.repository == 'True-Ruslan/zakup-gotov' && github.head_ref == 'docs/m0a-development-workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v6
        with:
          ref: docs/m0a-development-workflow

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.4.0

      - name: Run unified verification
        run: |
          chmod +x scripts/verify.sh
          ./scripts/verify.sh

      - name: Persist executable bit after successful verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git update-index --chmod=+x scripts/verify.sh
          git diff --cached --quiet && exit 0
          git commit -m "chore: mark verification script executable"
          git push origin HEAD:docs/m0a-development-workflow
