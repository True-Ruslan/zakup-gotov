name: Temporary Retailer Bridge Lockfile

on:
  push:
    branches:
      - chore/m0b-retailer-bridge-workspace

permissions:
  contents: read

jobs:
  generate:
    name: Generate pnpm lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.4.0

      - name: Regenerate lockfile normally
        run: pnpm install --lockfile-only

      - name: Verify generated lockfile with frozen install
        run: pnpm install --frozen-lockfile

      - name: Upload generated lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: retailer-bridge-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
