name: Temporary Retailer Bridge Lockfile

on:
  push:
    branches:
      - chore/m0b-retailer-bridge-workspace

permissions:
  contents: write

jobs:
  generate:
    name: Generate pnpm lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.4.0

      - name: Regenerate lockfile normally
        run: pnpm install --lockfile-only

      - name: Verify generated lockfile with frozen install
        run: pnpm install --frozen-lockfile

      - name: Commit exact generated lockfile when changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Generated lockfile already matches the branch."
            exit 0
          fi

          export LOCK_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/pnpm-lock.yaml?ref=${GITHUB_REF_NAME}" --jq .sha)"
          python3 - <<'PY'
          import base64
          import json
          import os

          with open("pnpm-lock.yaml", "rb") as source:
              content = base64.b64encode(source.read()).decode("ascii")

          payload = {
              "message": "chore(bridge): regenerate pnpm lockfile",
              "content": content,
              "sha": os.environ["LOCK_SHA"],
              "branch": os.environ["GITHUB_REF_NAME"],
          }
          with open("/tmp/lockfile-update.json", "w", encoding="utf-8") as target:
              json.dump(payload, target)
          PY

          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/pnpm-lock.yaml" \
            --input /tmp/lockfile-update.json \
            >/dev/null
