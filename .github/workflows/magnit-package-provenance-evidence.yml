name: Magnit Package Provenance Evidence

on:
  push:
    branches:
      - evidence/magnit-package-provenance-2026-08-12

permissions:
  contents: read

concurrency:
  group: magnit-package-provenance-evidence
  cancel-in-progress: true

jobs:
  evidence:
    name: Magnit Package Provenance Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.18.1"

      - name: Inspect raw Magnit JSON-LD package dimensions
        run: node apps/web/evidence/magnit-package-provenance.mjs
