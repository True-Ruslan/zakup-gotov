name: Magnit Package Provenance Evidence

on:
  push:
    branches:
      - evidence/magnit-package-provenance-2026-08-12

permissions:
  contents: read

concurrency:
  group: magnit-package-provenance-evidence
  cancel-in-progress: false

jobs:
  evidence:
    name: Magnit Package Provenance Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.4.0

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.18.1"
          test "$(pnpm --version)" = "11.4.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Compare raw HTML and hydrated browser surfaces
        run: pnpm --filter web exec node evidence/magnit-package-provenance.mjs
