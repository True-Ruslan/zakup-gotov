name: Contract CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Contract CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.4.0

      - name: Verify toolchain
        run: |
          set -euo pipefail
          node --version
          pnpm --version
          test "$(node --version)" = "v24.18.1"
          test "$(pnpm --version)" = "11.4.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated schema is current
        run: pnpm --filter @zakup-gotov/api-client check:generated

      - name: Typecheck API client
        run: pnpm --filter @zakup-gotov/api-client typecheck

      - name: Test API client
        run: pnpm --filter @zakup-gotov/api-client test

      - name: Build API client
        run: pnpm --filter @zakup-gotov/api-client build
