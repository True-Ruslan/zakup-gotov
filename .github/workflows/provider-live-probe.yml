name: Provider Live Probe

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  statuses: write

concurrency:
  group: provider-live-probe-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  pyaterochka:
    name: Pyaterochka Plain HTTP Phase A
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 38 &&
       github.actor == 'True-Ruslan' &&
       github.event.comment.body == '/provider-probe pyaterochka')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      - name: Verify pinned toolchain
        working-directory: apps/api
        shell: bash
        run: |
          set -euo pipefail
          java -version 2>&1 | grep -Eq 'version "25([.\"])'
          ./mvnw --version | grep -F 'Apache Maven 3.9.16'

      - name: Run Pyaterochka plain HTTP Phase A
        working-directory: apps/api
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          ./mvnw --batch-mode --no-transfer-progress \
            -Dtest=PyaterochkaPlainHttpProbeTest \
            -Dzakup.live.pyaterochka=true \
            test 2>&1 | tee "$RUNNER_TEMP/pyaterochka-live-probe.log"

      - name: Publish sanitized evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo '## Pyaterochka plain HTTP Phase A' >> "$GITHUB_STEP_SUMMARY"

          evidence=''
          if [[ -f "$RUNNER_TEMP/pyaterochka-live-probe.log" ]]; then
            evidence="$(grep -F 'PYATEROCHKA_PHASE_A' "$RUNNER_TEMP/pyaterochka-live-probe.log" | tail -n 1 || true)"
          fi

          state='failure'
          outcome='no-evidence'
          description='PYATEROCHKA_PHASE_A no_sanitized_evidence=true'

          if [[ -n "$evidence" ]]; then
            description="$evidence"
            printf '`%s`\n' "$evidence" >> "$GITHUB_STEP_SUMMARY"

            store_status="$(sed -n 's/.*store_status=\([-0-9]*\).*/\1/p' <<<"$evidence")"
            sap_present="$(sed -n 's/.*sap_code_present=\([^ ]*\).*/\1/p' <<<"$evidence")"
            search_status="$(sed -n 's/.*search_status=\([-0-9]*\).*/\1/p' <<<"$evidence")"
            plu_present="$(sed -n 's/.*plu_present=\([^ ]*\).*/\1/p' <<<"$evidence")"
            price_evidence="$(sed -n 's/.*price_evidence=\([^ ]*\).*/\1/p' <<<"$evidence")"

            if [[ "$store_status" =~ ^2[0-9][0-9]$ \
               && "$sap_present" == 'true' \
               && "$search_status" =~ ^2[0-9][0-9]$ \
               && "$plu_present" == 'true' \
               && "$price_evidence" == 'true' ]]; then
              state='success'
              outcome='pass'
            elif [[ ! "$store_status" =~ ^2[0-9][0-9]$ ]]; then
              outcome="store-${store_status:-unknown}"
            elif [[ "$sap_present" != 'true' ]]; then
              outcome='store-shape'
            elif [[ ! "$search_status" =~ ^2[0-9][0-9]$ ]]; then
              outcome="search-${search_status:-unknown}"
            elif [[ "$plu_present" != 'true' ]]; then
              outcome='search-shape'
            elif [[ "$price_evidence" != 'true' ]]; then
              outcome='price-missing'
            else
              outcome='failed'
            fi
          else
            echo 'No sanitized Phase A evidence line was emitted.' >> "$GITHUB_STEP_SUMMARY"
          fi

          context="Provider Live Probe / Pyaterochka / ${outcome}"
          description="${description:0:140}"
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="$context" \
            -f description="$description" >/dev/null

  perekrestok:
    name: Perekrestok Plain HTTP Phase A
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 43 &&
      github.actor == 'True-Ruslan' &&
      github.event.comment.body == '/provider-probe perekrestok'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      - name: Verify pinned toolchain
        working-directory: apps/api
        shell: bash
        run: |
          set -euo pipefail
          java -version 2>&1 | grep -Eq 'version "25([.\"])'
          ./mvnw --version | grep -F 'Apache Maven 3.9.16'

      - name: Run Perekrestok plain HTTP Phase A
        working-directory: apps/api
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          ./mvnw --batch-mode --no-transfer-progress \
            -Dtest=PerekrestokPlainHttpProbeTest \
            -Dzakup.live.perekrestok=true \
            test 2>&1 | tee "$RUNNER_TEMP/perekrestok-live-probe.log"

      - name: Publish sanitized evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo '## Perekrestok plain HTTP Phase A' >> "$GITHUB_STEP_SUMMARY"

          evidence=''
          if [[ -f "$RUNNER_TEMP/perekrestok-live-probe.log" ]]; then
            evidence="$(grep -F 'PEREKRESTOK_PHASE_A' "$RUNNER_TEMP/perekrestok-live-probe.log" | tail -n 1 || true)"
          fi

          state='failure'
          outcome='no-evidence'
          description='PEREKRESTOK_PHASE_A no_sanitized_evidence=true'

          if [[ -n "$evidence" ]]; then
            description="$evidence"
            printf '`%s`\n' "$evidence" >> "$GITHUB_STEP_SUMMARY"

            store_status="$(sed -n 's/.*store_status=\([-0-9]*\).*/\1/p' <<<"$evidence")"
            shop_present="$(sed -n 's/.*shop_id_present=\([^ ]*\).*/\1/p' <<<"$evidence")"
            selection_status="$(sed -n 's/.*selection_status=\([-0-9]*\).*/\1/p' <<<"$evidence")"
            search_status="$(sed -n 's/.*search_status=\([-0-9]*\).*/\1/p' <<<"$evidence")"
            plu_present="$(sed -n 's/.*plu_present=\([^ ]*\).*/\1/p' <<<"$evidence")"
            price_evidence="$(sed -n 's/.*price_evidence=\([^ ]*\).*/\1/p' <<<"$evidence")"

            if [[ "$store_status" =~ ^2[0-9][0-9]$ \
               && "$shop_present" == 'true' \
               && "$selection_status" =~ ^2[0-9][0-9]$ \
               && "$search_status" =~ ^2[0-9][0-9]$ \
               && "$plu_present" == 'true' \
               && "$price_evidence" == 'true' ]]; then
              state='success'
              outcome='pass'
            elif [[ ! "$store_status" =~ ^2[0-9][0-9]$ ]]; then
              outcome="store-${store_status:-unknown}"
            elif [[ "$shop_present" != 'true' ]]; then
              outcome='store-shape'
            elif [[ ! "$selection_status" =~ ^2[0-9][0-9]$ ]]; then
              outcome="selection-${selection_status:-unknown}"
            elif [[ ! "$search_status" =~ ^2[0-9][0-9]$ ]]; then
              outcome="search-${search_status:-unknown}"
            elif [[ "$plu_present" != 'true' ]]; then
              outcome='search-shape'
            elif [[ "$price_evidence" != 'true' ]]; then
              outcome='price-missing'
            else
              outcome='failed'
            fi
          else
            echo 'No sanitized Phase A evidence line was emitted.' >> "$GITHUB_STEP_SUMMARY"
          fi

          context="Provider Live Probe / Perekrestok / ${outcome}"
          description="${description:0:140}"
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="$context" \
            -f description="$description" >/dev/null

  chizhik:
    name: Chizhik Plain HTTP Phase A
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 155 &&
      github.actor == 'True-Ruslan' &&
      github.event.comment.body == '/provider-probe chizhik'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      - name: Verify pinned toolchain
        working-directory: apps/api
        shell: bash
        run: |
          set -euo pipefail
          java -version 2>&1 | grep -Eq 'version "25([.\"])'
          ./mvnw --version | grep -F 'Apache Maven 3.9.16'

      - name: Run Chizhik plain HTTP Phase A
        working-directory: apps/api
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          ./mvnw --batch-mode --no-transfer-progress \
            -Dtest=ChizhikPlainHttpProbeTest \
            -Dzakup.live.chizhik=true \
            test 2>&1 | tee "$RUNNER_TEMP/chizhik-live-probe.log"

      - name: Publish sanitized evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo '## Chizhik plain HTTP Phase A' >> "$GITHUB_STEP_SUMMARY"

          evidence=''
          if [[ -f "$RUNNER_TEMP/chizhik-live-probe.log" ]]; then
            evidence="$(grep -F 'CHIZHIK_PHASE_A' "$RUNNER_TEMP/chizhik-live-probe.log" | tail -n 1 || true)"
          fi

          state='failure'
          outcome='no-evidence'
          description='CHIZHIK_PHASE_A no_sanitized_evidence=true'

          if [[ -n "$evidence" ]]; then
            description="$evidence"
            printf '`%s`\n' "$evidence" >> "$GITHUB_STEP_SUMMARY"

            categories_outcome="$(sed -n 's/.*categories_outcome=\([^ ]*\).*/\1/p' <<<"$evidence")"
            categories_status="$(sed -n 's/.*categories_status=\([-0-9]*\).*/\1/p' <<<"$evidence")"
            categories_shape="$(sed -n 's/.*categories_shape=\([^ ]*\).*/\1/p' <<<"$evidence")"
            search_outcome="$(sed -n 's/.*search_outcome=\([^ ]*\).*/\1/p' <<<"$evidence")"
            search_status="$(sed -n 's/.*search_status=\([-0-9]*\).*/\1/p' <<<"$evidence")"
            product_id="$(sed -n 's/.*product_id_present=\([^ ]*\).*/\1/p' <<<"$evidence")"
            product_title="$(sed -n 's/.*product_title_present=\([^ ]*\).*/\1/p' <<<"$evidence")"
            price_evidence="$(sed -n 's/.*price_evidence=\([^ ]*\).*/\1/p' <<<"$evidence")"

            if [[ "$categories_outcome" == 'ACCESSIBLE' \
               && "$categories_status" =~ ^2[0-9][0-9]$ \
               && "$categories_shape" == 'true' \
               && "$search_outcome" == 'ACCESSIBLE' \
               && "$search_status" =~ ^2[0-9][0-9]$ \
               && "$product_id" == 'true' \
               && "$product_title" == 'true' \
               && "$price_evidence" == 'true' ]]; then
              state='success'
              outcome='pass'
            elif [[ "$categories_outcome" != 'ACCESSIBLE' ]]; then
              outcome="categories-${categories_outcome:-unknown}"
            elif [[ "$categories_shape" != 'true' ]]; then
              outcome='categories-shape'
            elif [[ "$search_outcome" != 'ACCESSIBLE' ]]; then
              outcome="search-${search_outcome:-unknown}"
            elif [[ "$product_id" != 'true' || "$product_title" != 'true' ]]; then
              outcome='search-shape'
            elif [[ "$price_evidence" != 'true' ]]; then
              outcome='price-missing'
            else
              outcome='failed'
            fi
          else
            echo 'No sanitized Phase A evidence line was emitted.' >> "$GITHUB_STEP_SUMMARY"
          fi

          context="Provider Live Probe / Chizhik / ${outcome}"
          description="${description:0:140}"
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="$context" \
            -f description="$description" >/dev/null
