name: Temporary M4.2 Acceptance Docs Sync

on:
  push:
    branches:
      - docs/m4-2-one-retailer-truthful-total-acceptance
    paths:
      - .github/workflows/docs-m4-2-sync.yml
      - .github/scripts/sync_m4_2_acceptance.py

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/m4-2-one-retailer-truthful-total-acceptance

      - name: Synchronize canonical M4.2 acceptance docs
        run: python .github/scripts/sync_m4_2_acceptance.py

      - name: Commit synchronized docs
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/PROJECT_STATE.md docs/ROADMAP.md CHANGELOG.md; then
            echo "Canonical docs already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATE.md docs/ROADMAP.md CHANGELOG.md
          git commit -m "docs(m4): synchronize truthful checkout acceptance"
          git push origin HEAD:docs/m4-2-one-retailer-truthful-total-acceptance
