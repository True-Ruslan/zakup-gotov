name: M3.5.4 Changelog Bootstrap

on:
  push:
    branches:
      - feat/m3-5-4-responsive-pantry-controls

permissions:
  contents: write

jobs:
  sync-changelog:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Patch changelog
        run: python .github/scripts/m3_5_4_changelog_sync.py
      - name: Commit changelog when changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(m3): record responsive Pantry controls"
          git push
