name: M3.5.3 Contract Bootstrap

on:
  push:
    branches:
      - feat/m3-5-3-pantry-weekly-plan-comparison

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, 'bootstrap generated Pantry comparison contract') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/m3-5-3-pantry-weekly-plan-comparison

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.4.0

      - name: Apply deterministic OpenAPI additions
        shell: python
        run: |
          from pathlib import Path

          path = Path("openapi/zakup-gotov.yaml")
          text = path.read_text()

          def insert_once(source: str, anchor: str, addition: str) -> str:
              count = source.count(anchor)
              if count != 1:
                  raise SystemExit(f"expected exactly one anchor, found {count}: {anchor!r}")
              return source.replace(anchor, addition + anchor, 1)

          text = insert_once(
              text,
              "  /api/v1/weekly-plan-comparison-previews:\n",
              """  /api/v1/weekly-plan-pantry-comparison-previews:
            post:
              operationId: createWeeklyPlanPantryComparisonPreview
              summary: Create a transient Pantry-aware weekly-plan-to-retailer comparison preview
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/WeeklyPlanPantryComparisonPreviewRequest'
              responses:
                '200':
                  description: Pantry-aware WeeklyPlan shopping audit with explicit comparison outcome
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/WeeklyPlanPantryComparisonPreview'
                '400':
                  description: Invalid Pantry-aware weekly plan comparison preview request
                  content:
                    application/problem+json:
                      schema:
                        $ref: '#/components/schemas/InvalidWeeklyPlanPantryComparisonPreviewProblem'
          """
          )

          text = insert_once(
              text,
              "    QuantityInputUnit:\n",
              """    WeeklyPlanPantryComparisonPreviewRequest:
            type: object
            additionalProperties: false
            required:
              - locality
              - weeklyPlan
              - pantry
            properties:
              locality:
                type: string
                minLength: 1
                maxLength: 160
              weeklyPlan:
                $ref: '#/components/schemas/WeeklyPlanShoppingPreviewRequest'
              pantry:
                type: array
                items:
                  $ref: '#/components/schemas/WeeklyPlanPantryItemInput'
          """
          )

          text = insert_once(
              text,
              "    WeeklyPlanComparisonPreview:\n",
              """    WeeklyPlanPantryComparisonPreview:
            type: object
            additionalProperties: false
            required:
              - pantryShoppingPreview
              - comparisonOutcome
            properties:
              pantryShoppingPreview:
                $ref: '#/components/schemas/WeeklyPlanPantryShoppingPreview'
              comparisonOutcome:
                $ref: '#/components/schemas/WeeklyPlanPantryComparisonOutcome'
              comparisonPreview:
                $ref: '#/components/schemas/ComparisonPreviewResponse'
            description: comparisonPreview is present only when comparisonOutcome is COMPARED.
          
              WeeklyPlanPantryComparisonOutcome:
            type: string
            enum:
              - COMPARED
              - NO_REMAINING_DEMAND
          """.replace("          \n              WeeklyPlanPantryComparisonOutcome:", "    WeeklyPlanPantryComparisonOutcome:")
          )

          text = insert_once(
              text,
              "    InvalidWeeklyPlanComparisonPreviewProblem:\n",
              """    InvalidWeeklyPlanPantryComparisonPreviewProblem:
            type: object
            additionalProperties: false
            required:
              - type
              - title
              - status
              - code
              - errors
            properties:
              type:
                type: string
                const: https://zakup-gotov.dev/problems/invalid-weekly-plan-pantry-comparison-preview
              title:
                type: string
                const: Invalid weekly plan pantry comparison preview request
              status:
                type: integer
                const: 400
              code:
                type: string
                const: INVALID_WEEKLY_PLAN_PANTRY_COMPARISON_PREVIEW
              errors:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/WeeklyPlanPantryComparisonPreviewValidationError'
              
              WeeklyPlanPantryComparisonPreviewValidationError:
            type: object
            additionalProperties: false
            required:
              - field
              - message
            properties:
              field:
                type: string
                minLength: 1
              message:
                type: string
                minLength: 1
          """.replace("              \n              WeeklyPlanPantryComparisonPreviewValidationError:", "    WeeklyPlanPantryComparisonPreviewValidationError:")
          )

          path.write_text(text)

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate exact TypeScript schema
        run: pnpm --filter @zakup-gotov/api-client generate

      - name: Commit generated contract
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi/zakup-gotov.yaml packages/api-client/src/schema.d.ts
          git diff --cached --check
          git commit -m "chore(m3): bootstrap generated Pantry comparison contract"
          git push origin HEAD:feat/m3-5-3-pantry-weekly-plan-comparison
