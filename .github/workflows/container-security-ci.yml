name: Container Security CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  scan:
    name: Container Security / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            dockerfile: apps/api/Dockerfile
            image: zakup-gotov-api:ci
          - name: Web
            dockerfile: apps/web/Dockerfile
            image: zakup-gotov-web:ci

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build production image
        run: |
          set -euo pipefail
          docker build \
            --pull \
            --file "${{ matrix.dockerfile }}" \
            --tag "${{ matrix.image }}" \
            .

      - name: Validate web VEX contract
        if: matrix.name == 'Web'
        run: python3 scripts/security/validate_web_vex.py

      - name: Verify web VEX runtime assumptions
        if: matrix.name == 'Web'
        run: bash scripts/security/verify_web_vex_runtime.sh "${{ matrix.image }}" linux/amd64 local

      - name: Scan API HIGH/CRITICAL vulnerabilities
        if: matrix.name == 'API'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          scanners: vuln

      - name: Scan Web HIGH/CRITICAL vulnerabilities with reviewed VEX
        if: matrix.name == 'Web'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_VEX: security/vex/CVE-2026-14456.openvex.json
          TRIVY_SHOW_SUPPRESSED: "true"
        with:
          image-ref: ${{ matrix.image }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          scanners: vuln
