name: M3.5.3 Docs Bootstrap

on:
  push:
    branches:
      - docs/m3-5-3-pantry-weekly-plan-comparison-acceptance

permissions:
  contents: write

jobs:
  sync-docs:
    name: M3.5.3 Docs Bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Patch PROJECT_STATE
        run: python .github/scripts/m3_5_3_docs_sync.py state
      - name: Patch ROADMAP
        run: python .github/scripts/m3_5_3_docs_sync.py roadmap
      - name: Patch CHANGELOG
        run: python .github/scripts/m3_5_3_docs_sync.py changelog
      - name: Commit canonical docs when changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATE.md docs/ROADMAP.md docs/CHANGELOG.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No canonical docs changes required."
            exit 0
          fi
          git commit -m "docs(m3): finalize M3.5.3 acceptance state"
          git push
