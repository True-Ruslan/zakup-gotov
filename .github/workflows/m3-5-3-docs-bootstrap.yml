name: M3.5.3 Docs Bootstrap

on:
  push:
    branches:
      - docs/m3-5-3-pantry-weekly-plan-comparison-acceptance

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch canonical docs
        run: python .github/scripts/m3_5_3_docs_sync.py
      - name: Commit canonical docs when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATE.md docs/ROADMAP.md docs/CHANGELOG.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No canonical docs changes required."
            exit 0
          fi
          git commit -m "docs(m3): finalize M3.5.3 acceptance state"
          git push
