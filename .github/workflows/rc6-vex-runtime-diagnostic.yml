name: RC6 VEX Runtime Diagnostic

on:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  reproduce:
    name: Reproduce rc.6 multiarch VEX runtime guard failure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
        with:
          image: tonistiigi/binfmt@sha256:465d3fdd28d0f2b871ba4b4ec98bd183292e96167f00d9fd40bd249f8632d705
          platforms: arm64
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: |
            image=moby/buildkit@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - name: Reproduce rc.6 guard sequence against immutable candidate index
        env:
          RC6_WEB_INDEX: ghcr.io/true-ruslan/zakup-gotov-staging-web@sha256:715c4484cabfcac849bf3d2b9bbbede380f705fb9b666fef67287021a764b460
        run: |
          set -euo pipefail
          bash scripts/security/verify_web_vex_runtime.sh "${RC6_WEB_INDEX}" linux/amd64
          bash scripts/security/verify_web_vex_runtime.sh "${RC6_WEB_INDEX}" linux/arm64
