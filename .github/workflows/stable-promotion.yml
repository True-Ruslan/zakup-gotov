name: Stable Promotion

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: stable-v0.1.0-promotion
  cancel-in-progress: false

env:
  SOURCE_RC_TAG: v0.1.0-rc.7
  SOURCE_RC_VERSION: 0.1.0-rc.7
  STABLE_TAG: v0.1.0
  STABLE_VERSION: 0.1.0
  SOURCE_SHA: b754f5193f852db0312011f3f6c3ec6c7dd22eb2
  SOURCE_API_DIGEST: sha256:1c5c4a104fee295cd579b0e69a23b508a297b1eb931a45c0ce71d8b1791e54e1
  SOURCE_WEB_DIGEST: sha256:5bc236f3f304dffe29f54921f5a2bbf27d3df67c18714d4cc268d6d25bafce68
  MANUAL_CANARY_RUN: '32359437905'
  MANUAL_CANARY_HARNESS_SHA: da35a5cb7ef46c64d266cd29731167eaa4cbefb4
  MANUAL_ACCEPTANCE_COMMENT: '5354743275'
  MANUAL_CANARY_ARTIFACT_ID: '9402970517'
  MANUAL_CANARY_ARTIFACT_DIGEST: sha256:158afcff6c270526823ad372cf883cb5eeaf723eacfacab4d2a46fb68c625c25
  API_IMAGE: ghcr.io/true-ruslan/zakup-gotov-api
  WEB_IMAGE: ghcr.io/true-ruslan/zakup-gotov-web

jobs:
  promote:
    name: Stable Promotion / v0.1.0
    if: >-
      github.event.issue.number == 152 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/release-stable v0.1.0 from v0.1.0-rc.7'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: write
      issues: read
      packages: write
    steps:
      - name: Check out promotion harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare promotion workspace
        run: |
          set -euo pipefail
          WORK_ROOT="$RUNNER_TEMP/stable-v0.1.0-promotion"
          SOURCE_DIR="$WORK_ROOT/source"
          STABLE_DIR="$WORK_ROOT/stable"
          NOTES_FILE="$WORK_ROOT/release-notes.md"
          mkdir -p "$SOURCE_DIR" "$STABLE_DIR"
          {
            echo "WORK_ROOT=$WORK_ROOT"
            echo "SOURCE_DIR=$SOURCE_DIR"
            echo "STABLE_DIR=$STABLE_DIR"
            echo "NOTES_FILE=$NOTES_FILE"
          } >> "$GITHUB_ENV"

      - name: Verify accepted manual canary evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MANUAL_CANARY_RUN" > "$WORK_ROOT/manual-canary-run.json"
          jq -e \
            --arg expected_sha "$MANUAL_CANARY_HARNESS_SHA" \
            '.conclusion == "success" and .event == "issue_comment" and .head_sha == $expected_sha' \
            "$WORK_ROOT/manual-canary-run.json" >/dev/null

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MANUAL_CANARY_RUN/artifacts" > "$WORK_ROOT/manual-canary-artifacts.json"
          jq -e \
            --argjson expected_id "$MANUAL_CANARY_ARTIFACT_ID" \
            --arg expected_digest "$MANUAL_CANARY_ARTIFACT_DIGEST" \
            '[.artifacts[] | select(.id == $expected_id and .expired == false and .digest == $expected_digest)] | length == 1' \
            "$WORK_ROOT/manual-canary-artifacts.json" >/dev/null

          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$MANUAL_ACCEPTANCE_COMMENT" > "$WORK_ROOT/manual-acceptance.json"
          jq -e \
            --arg owner "$GITHUB_REPOSITORY_OWNER" \
            --arg run "$MANUAL_CANARY_RUN" \
            --arg tag "$SOURCE_RC_TAG" \
            --arg source "$SOURCE_SHA" \
            '.user.login == $owner and
             (.body | contains("manual product canary — ACCEPTED")) and
             (.body | contains($run)) and
             (.body | contains($tag)) and
             (.body | contains($source))' \
            "$WORK_ROOT/manual-acceptance.json" >/dev/null

      - name: Verify immutable source release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$SOURCE_RC_TAG" > "$WORK_ROOT/source-release-api.json"
          jq -e \
            --arg tag "$SOURCE_RC_TAG" \
            --arg source "$SOURCE_SHA" \
            '.tag_name == $tag and .draft == false and .prerelease == true and .target_commitish == $source' \
            "$WORK_ROOT/source-release-api.json" >/dev/null

          git fetch --force --no-tags origin "refs/tags/$SOURCE_RC_TAG:refs/tags/$SOURCE_RC_TAG"
          test "$(git rev-parse "$SOURCE_RC_TAG^{commit}")" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main

      - name: Download and verify rc.7 release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$SOURCE_RC_TAG" --dir "$SOURCE_DIR"

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          expected = {
              "SHA256SUMS",
              "api-amd64-sbom.spdx.json",
              "api-amd64-vulnerabilities.json",
              "api-arm64-sbom.spdx.json",
              "api-arm64-vulnerabilities.json",
              "api-manifest.json",
              "compose.release.yaml",
              "release-verification.json",
              "web-CVE-2026-14456.openvex.json",
              "web-amd64-sbom.spdx.json",
              "web-amd64-vulnerabilities.json",
              "web-arm64-sbom.spdx.json",
              "web-arm64-vulnerabilities.json",
              "web-manifest.json",
          }
          source = pathlib.Path(os.environ["SOURCE_DIR"])
          actual = {path.name for path in source.iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(f"unexpected rc.7 release asset set: expected={sorted(expected)} actual={sorted(actual)}")

          release = json.loads(pathlib.Path(os.environ["WORK_ROOT"]).joinpath("source-release-api.json").read_text())
          remote = {}
          for asset in release["assets"]:
              name = asset["name"]
              if name in remote:
                  raise SystemExit(f"duplicate rc.7 release asset: {name}")
              remote[name] = asset.get("digest")
          local = {
              path.name: "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
              for path in source.iterdir()
              if path.is_file()
          }
          if remote != local:
              raise SystemExit(f"rc.7 server-side asset digest mismatch: remote={remote} local={local}")
          PY

          assets=(
            api-amd64-sbom.spdx.json
            api-amd64-vulnerabilities.json
            api-arm64-sbom.spdx.json
            api-arm64-vulnerabilities.json
            api-manifest.json
            compose.release.yaml
            release-verification.json
            web-CVE-2026-14456.openvex.json
            web-amd64-sbom.spdx.json
            web-amd64-vulnerabilities.json
            web-arm64-sbom.spdx.json
            web-arm64-vulnerabilities.json
            web-manifest.json
          )
          python3 scripts/release/verify_release_asset_checksums.py \
            "$SOURCE_DIR/SHA256SUMS" \
            "$SOURCE_DIR" \
            "${assets[@]}"

      - name: Verify rc.7 release metadata and accepted digests
        run: |
          set -euo pipefail
          jq -e \
            --arg expected_source "$SOURCE_SHA" \
            --arg expected_api_image "$API_IMAGE" \
            --arg expected_api_digest "$SOURCE_API_DIGEST" \
            --arg expected_web_image "$WEB_IMAGE" \
            --arg expected_web_digest "$SOURCE_WEB_DIGEST" \
            '.source_sha == $expected_source and
             .stable == false and
             .version == "0.1.0-rc.7" and
             .api.image == $expected_api_image and
             .api.digest == $expected_api_digest and
             .web.image == $expected_web_image and
             .web.digest == $expected_web_digest and
             .platforms == ["linux/amd64", "linux/arm64"] and
             .vulnerability_gate == "CRITICAL,HIGH"' \
            "$SOURCE_DIR/release-verification.json" >/dev/null

          test "$(grep -Fxc "    image: $API_IMAGE@$SOURCE_API_DIGEST" "$SOURCE_DIR/compose.release.yaml")" -eq 1
          test "$(grep -Fxc "    image: $WEB_IMAGE@$SOURCE_WEB_DIGEST" "$SOURCE_DIR/compose.release.yaml")" -eq 1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: |
            image=moby/buildkit@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - name: Verify rc.7 registry identities and exact bundle
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw \
            "$API_IMAGE@$SOURCE_API_DIGEST" > "$WORK_ROOT/api-source-index.json"
          docker buildx imagetools inspect --raw \
            "$WEB_IMAGE@$SOURCE_WEB_DIGEST" > "$WORK_ROOT/web-source-index.json"
          docker buildx imagetools inspect --raw \
            "$API_IMAGE:$SOURCE_RC_VERSION" > "$WORK_ROOT/api-rc-index.json"
          docker buildx imagetools inspect --raw \
            "$WEB_IMAGE:$SOURCE_RC_VERSION" > "$WORK_ROOT/web-rc-index.json"

          python3 scripts/release/verify_oci_manifest_equivalence.py \
            "$SOURCE_DIR/api-manifest.json" \
            "$WORK_ROOT/api-source-index.json"
          python3 scripts/release/verify_oci_manifest_equivalence.py \
            "$SOURCE_DIR/web-manifest.json" \
            "$WORK_ROOT/web-source-index.json"
          python3 scripts/release/verify_oci_manifest_equivalence.py \
            "$WORK_ROOT/api-source-index.json" \
            "$WORK_ROOT/api-rc-index.json"
          python3 scripts/release/verify_oci_manifest_equivalence.py \
            "$WORK_ROOT/web-source-index.json" \
            "$WORK_ROOT/web-rc-index.json"

          bash scripts/release/verify-published-release.sh "$SOURCE_DIR/compose.release.yaml"

      - name: Prepare stable release evidence and notes
        run: |
          set -euo pipefail
          cp "$SOURCE_DIR"/api-amd64-sbom.spdx.json "$STABLE_DIR"/
          cp "$SOURCE_DIR"/api-amd64-vulnerabilities.json "$STABLE_DIR"/
          cp "$SOURCE_DIR"/api-arm64-sbom.spdx.json "$STABLE_DIR"/
          cp "$SOURCE_DIR"/api-arm64-vulnerabilities.json "$STABLE_DIR"/
          cp "$SOURCE_DIR"/api-manifest.json "$STABLE_DIR"/
          cp "$SOURCE_DIR"/compose.release.yaml "$STABLE_DIR"/
          cp "$SOURCE_DIR"/web-CVE-2026-14456.openvex.json "$STABLE_DIR"/
          cp "$SOURCE_DIR"/web-amd64-sbom.spdx.json "$STABLE_DIR"/
          cp "$SOURCE_DIR"/web-amd64-vulnerabilities.json "$STABLE_DIR"/
          cp "$SOURCE_DIR"/web-arm64-sbom.spdx.json "$STABLE_DIR"/
          cp "$SOURCE_DIR"/web-arm64-vulnerabilities.json "$STABLE_DIR"/
          cp "$SOURCE_DIR"/web-manifest.json "$STABLE_DIR"/

          jq -n \
            --arg version "$STABLE_VERSION" \
            --arg source_sha "$SOURCE_SHA" \
            --arg api_image "$API_IMAGE" \
            --arg api_digest "$SOURCE_API_DIGEST" \
            --arg web_image "$WEB_IMAGE" \
            --arg web_digest "$SOURCE_WEB_DIGEST" \
            --arg promoted_from "$SOURCE_RC_TAG" \
            --arg manual_canary_run "$MANUAL_CANARY_RUN" \
            --arg promotion_workflow_run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{
              version: $version,
              source_sha: $source_sha,
              stable: true,
              platforms: ["linux/amd64", "linux/arm64"],
              vulnerability_gate: "CRITICAL,HIGH",
              api: {image: $api_image, digest: $api_digest},
              web: {image: $web_image, digest: $web_digest},
              promoted_from: $promoted_from,
              manual_canary_run: $manual_canary_run,
              promotion_workflow_run: $promotion_workflow_run
            }' > "$STABLE_DIR/release-verification.json"

          jq -n \
            --arg stable_tag "$STABLE_TAG" \
            --arg promoted_from "$SOURCE_RC_TAG" \
            --arg source_sha "$SOURCE_SHA" \
            --arg api_digest "$SOURCE_API_DIGEST" \
            --arg web_digest "$SOURCE_WEB_DIGEST" \
            --arg manual_canary_run "$MANUAL_CANARY_RUN" \
            --arg manual_canary_harness_sha "$MANUAL_CANARY_HARNESS_SHA" \
            --arg manual_acceptance_comment "$MANUAL_ACCEPTANCE_COMMENT" \
            --arg manual_canary_artifact_id "$MANUAL_CANARY_ARTIFACT_ID" \
            --arg manual_canary_artifact_digest "$MANUAL_CANARY_ARTIFACT_DIGEST" \
            --arg promotion_workflow_run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{
              schema_version: 1,
              method: "manifest-equivalent-promotion",
              stable_tag: $stable_tag,
              promoted_from: $promoted_from,
              source_sha: $source_sha,
              api_digest: $api_digest,
              web_digest: $web_digest,
              manual_canary_run: $manual_canary_run,
              manual_canary_harness_sha: $manual_canary_harness_sha,
              manual_acceptance_comment: $manual_acceptance_comment,
              manual_canary_artifact_id: $manual_canary_artifact_id,
              manual_canary_artifact_digest: $manual_canary_artifact_digest,
              promotion_workflow_run: $promotion_workflow_run,
              stable_oci_tags: ["0.1.0", "latest"]
            }' > "$STABLE_DIR/stable-promotion-verification.json"

          stable_assets=(
            api-amd64-sbom.spdx.json
            api-amd64-vulnerabilities.json
            api-arm64-sbom.spdx.json
            api-arm64-vulnerabilities.json
            api-manifest.json
            compose.release.yaml
            release-verification.json
            stable-promotion-verification.json
            web-CVE-2026-14456.openvex.json
            web-amd64-sbom.spdx.json
            web-amd64-vulnerabilities.json
            web-arm64-sbom.spdx.json
            web-arm64-vulnerabilities.json
            web-manifest.json
          )
          : > "$STABLE_DIR/SHA256SUMS"
          for asset in "${stable_assets[@]}"; do
            digest="$(sha256sum "$STABLE_DIR/$asset" | awk '{print $1}')"
            printf '%s  dist/%s\n' "$digest" "$asset" >> "$STABLE_DIR/SHA256SUMS"
          done

          cat > "$NOTES_FILE" <<EOF
          # Zakup Gotov v0.1.0

          First stable release of Zakup Gotov.

          This release promotes the exact immutable artifacts accepted as \`$SOURCE_RC_TAG\`; API and Web are **not rebuilt** for stable publication.

          Accepted evidence:
          - source: \`$SOURCE_SHA\`;
          - manual product canary: run \`$MANUAL_CANARY_RUN\` — ACCEPTED;
          - API: \`$API_IMAGE@$SOURCE_API_DIGEST\`;
          - Web: \`$WEB_IMAGE@$SOURCE_WEB_DIGEST\`;
          - linux/amd64 + linux/arm64;
          - HIGH/CRITICAL vulnerability gates, SPDX SBOMs, exact-digest bundle smoke and provenance were accepted on rc.7.

          Stable OCI tags \`0.1.0\` and \`latest\` reference equivalent multi-platform indexes with the same accepted content-addressed platform manifests.
          EOF

      - name: Prepare or verify exact stable tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$STABLE_TAG" > "$WORK_ROOT/stable-tag-matches.json"
          exact_count="$(jq --arg ref "refs/tags/$STABLE_TAG" '[.[] | select(.ref == $ref)] | length' "$WORK_ROOT/stable-tag-matches.json")"
          if [[ "$exact_count" -gt 1 ]]; then
            echo "multiple exact stable tag references returned for $STABLE_TAG" >&2
            exit 1
          fi

          if [[ "$exact_count" -eq 0 ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              --raw-field ref="refs/tags/$STABLE_TAG" \
              --raw-field sha="$SOURCE_SHA" \
              > "$WORK_ROOT/stable-tag-created.json"
          fi

          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$STABLE_TAG" > "$WORK_ROOT/stable-tag.json"
          if ! jq -e \
            --arg ref "refs/tags/$STABLE_TAG" \
            --arg source "$SOURCE_SHA" \
            '.ref == $ref and .object.type == "commit" and .object.sha == $source' \
            "$WORK_ROOT/stable-tag.json" >/dev/null; then
            echo "stable tag exists but does not resolve to the accepted rc.7 source" >&2
            exit 1
          fi

      - name: Prepare or resume exact stable draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$WORK_ROOT/releases.json"
          count="$(jq --arg tag "$STABLE_TAG" '[.[] | select(.tag_name == $tag)] | length' "$WORK_ROOT/releases.json")"
          if [[ "$count" -gt 1 ]]; then
            echo "multiple releases exist for stable tag $STABLE_TAG" >&2
            exit 1
          fi

          if [[ "$count" -eq 1 ]]; then
            jq -e \
              --arg tag "$STABLE_TAG" \
              '[.[] | select(.tag_name == $tag)] | .[0] |
               .draft == true and .prerelease == false' \
              "$WORK_ROOT/releases.json" >/dev/null
            release_id="$(jq -r --arg tag "$STABLE_TAG" '[.[] | select(.tag_name == $tag)] | .[0].id' "$WORK_ROOT/releases.json")"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              --raw-field tag_name="$STABLE_TAG" \
              --raw-field name="$STABLE_TAG" \
              --raw-field body="$(cat "$NOTES_FILE")" \
              -F draft=true \
              -F prerelease=false \
              > "$WORK_ROOT/stable-draft-created.json"
            release_id="$(jq -r '.id' "$WORK_ROOT/stable-draft-created.json")"
          fi

          [[ "$release_id" =~ ^[0-9]+$ ]]
          echo "STABLE_RELEASE_ID=$release_id" >> "$GITHUB_ENV"

      - name: Upload stable draft evidence through release asset API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$STABLE_RELEASE_ID/assets?per_page=100" > "$WORK_ROOT/stable-existing-assets.json"

          for asset_path in "$STABLE_DIR"/*; do
            asset_name="$(basename "$asset_path")"
            local_digest="sha256:$(sha256sum "$asset_path" | awk '{print $1}')"
            existing_count="$(jq --arg name "$asset_name" '[.[] | select(.name == $name)] | length' "$WORK_ROOT/stable-existing-assets.json")"
            if [[ "$existing_count" -gt 1 ]]; then
              echo "multiple draft assets exist with name $asset_name" >&2
              exit 1
            fi
            if [[ "$existing_count" -eq 1 ]]; then
              existing_digest="$(jq -r --arg name "$asset_name" '[.[] | select(.name == $name)] | .[0].digest // ""' "$WORK_ROOT/stable-existing-assets.json")"
              if [[ "$existing_digest" != "$local_digest" ]]; then
                echo "asset already exists with unexpected digest: $asset_name" >&2
                exit 1
              fi
              echo "stable draft asset already exact: $asset_name"
              continue
            fi

            response="$WORK_ROOT/upload-$asset_name.json"
            curl --fail-with-body --silent --show-error --location \
              --request POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$asset_path" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$STABLE_RELEASE_ID/assets?name=$asset_name" \
              > "$response"
            jq -e \
              --arg name "$asset_name" \
              --arg digest "$local_digest" \
              '.state == "uploaded" and .name == $name and .digest == $digest' \
              "$response" >/dev/null
          done

      - name: Verify stable draft asset digests before registry mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$STABLE_RELEASE_ID" > "$WORK_ROOT/stable-draft-api.json"
          jq -e \
            --arg tag "$STABLE_TAG" \
            '.tag_name == $tag and .draft == true and .prerelease == false' \
            "$WORK_ROOT/stable-draft-api.json" >/dev/null

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          stable = pathlib.Path(os.environ["STABLE_DIR"])
          release = json.loads(pathlib.Path(os.environ["WORK_ROOT"]).joinpath("stable-draft-api.json").read_text())
          remote = {}
          for asset in release["assets"]:
              name = asset["name"]
              if name in remote:
                  raise SystemExit(f"duplicate stable draft asset: {name}")
              remote[name] = asset.get("digest")
          local = {
              path.name: "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
              for path in stable.iterdir()
              if path.is_file()
          }
          if remote != local:
              raise SystemExit(f"stable draft asset digest mismatch: remote={remote} local={local}")
          PY

      - name: Promote exact accepted digests to stable version
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$API_IMAGE:0.1.0" \
            --metadata-file "$WORK_ROOT/api-stable-promotion.json" \
            "$API_IMAGE@$SOURCE_API_DIGEST"
          docker buildx imagetools create \
            --tag "$WEB_IMAGE:0.1.0" \
            --metadata-file "$WORK_ROOT/web-stable-promotion.json" \
            "$WEB_IMAGE@$SOURCE_WEB_DIGEST"

          docker buildx imagetools inspect --raw \
            "$API_IMAGE:0.1.0" > "$WORK_ROOT/api-stable-index.json"
          docker buildx imagetools inspect --raw \
            "$WEB_IMAGE:0.1.0" > "$WORK_ROOT/web-stable-index.json"
          python3 scripts/release/verify_oci_manifest_equivalence.py \
            "$WORK_ROOT/api-source-index.json" \
            "$WORK_ROOT/api-stable-index.json"
          python3 scripts/release/verify_oci_manifest_equivalence.py \
            "$WORK_ROOT/web-source-index.json" \
            "$WORK_ROOT/web-stable-index.json"

      - name: Promote exact accepted digests to latest
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$API_IMAGE:latest" \
            --metadata-file "$WORK_ROOT/api-latest-promotion.json" \
            "$API_IMAGE@$SOURCE_API_DIGEST"
          docker buildx imagetools create \
            --tag "$WEB_IMAGE:latest" \
            --metadata-file "$WORK_ROOT/web-latest-promotion.json" \
            "$WEB_IMAGE@$SOURCE_WEB_DIGEST"

          docker buildx imagetools inspect --raw \
            "$API_IMAGE:latest" > "$WORK_ROOT/api-latest-index.json"
          docker buildx imagetools inspect --raw \
            "$WEB_IMAGE:latest" > "$WORK_ROOT/web-latest-index.json"
          python3 scripts/release/verify_oci_manifest_equivalence.py \
            "$WORK_ROOT/api-source-index.json" \
            "$WORK_ROOT/api-latest-index.json"
          python3 scripts/release/verify_oci_manifest_equivalence.py \
            "$WORK_ROOT/web-source-index.json" \
            "$WORK_ROOT/web-latest-index.json"

      - name: Verify stable and latest registry identities
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw \
            "$API_IMAGE:0.1.0" > "$WORK_ROOT/api-stable-final-index.json"
          docker buildx imagetools inspect --raw \
            "$WEB_IMAGE:0.1.0" > "$WORK_ROOT/web-stable-final-index.json"
          docker buildx imagetools inspect --raw \
            "$API_IMAGE:latest" > "$WORK_ROOT/api-latest-final-index.json"
          docker buildx imagetools inspect --raw \
            "$WEB_IMAGE:latest" > "$WORK_ROOT/web-latest-final-index.json"

          python3 scripts/release/verify_oci_manifest_equivalence.py \
            "$WORK_ROOT/api-source-index.json" \
            "$WORK_ROOT/api-stable-final-index.json"
          python3 scripts/release/verify_oci_manifest_equivalence.py \
            "$WORK_ROOT/web-source-index.json" \
            "$WORK_ROOT/web-stable-final-index.json"
          python3 scripts/release/verify_oci_manifest_equivalence.py \
            "$WORK_ROOT/api-source-index.json" \
            "$WORK_ROOT/api-latest-final-index.json"
          python3 scripts/release/verify_oci_manifest_equivalence.py \
            "$WORK_ROOT/web-source-index.json" \
            "$WORK_ROOT/web-latest-final-index.json"

          bash scripts/release/verify-published-release.sh "$STABLE_DIR/compose.release.yaml"

      - name: Publish stable GitHub Release last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$STABLE_RELEASE_ID" \
            -F draft=false \
            -F prerelease=false \
            --raw-field make_latest=true \
            > "$WORK_ROOT/stable-published.json"

      - name: Verify published stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -e \
            --arg tag "$STABLE_TAG" \
            '.tag_name == $tag and .draft == false and .prerelease == false' \
            "$WORK_ROOT/stable-published.json" >/dev/null

          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$STABLE_TAG" > "$WORK_ROOT/stable-published-tag.json"
          jq -e \
            --arg ref "refs/tags/$STABLE_TAG" \
            --arg source "$SOURCE_SHA" \
            '.ref == $ref and .object.type == "commit" and .object.sha == $source' \
            "$WORK_ROOT/stable-published-tag.json" >/dev/null

          gh api "repos/$GITHUB_REPOSITORY/releases/$STABLE_RELEASE_ID" > "$WORK_ROOT/stable-published-api.json"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          stable = pathlib.Path(os.environ["STABLE_DIR"])
          release = json.loads(pathlib.Path(os.environ["WORK_ROOT"]).joinpath("stable-published-api.json").read_text())
          if release["draft"] or release["prerelease"]:
              raise SystemExit("stable GitHub Release is not fully published")
          remote = {}
          for asset in release["assets"]:
              name = asset["name"]
              if name in remote:
                  raise SystemExit(f"duplicate published stable asset: {name}")
              remote[name] = asset.get("digest")
          local = {
              path.name: "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
              for path in stable.iterdir()
              if path.is_file()
          }
          if remote != local:
              raise SystemExit(f"published stable asset digest mismatch: remote={remote} local={local}")
          PY

  notify:
    name: Stable Promotion / review pointer
    needs: promote
    if: >-
      always() &&
      github.event.issue.number == 152 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/release-stable v0.1.0 from v0.1.0-rc.7'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Publish stable promotion result
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const result = '${{ needs.promote.result }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## stable v0.1.0 promotion',
              '',
              `Run: ${runUrl}`,
              `Promotion job: \`${result}\``,
              `Source: \`${process.env.SOURCE_RC_TAG}\` / \`${process.env.SOURCE_SHA}\``,
              '',
              result === 'success'
                ? 'Accepted rc.7 API/Web platform manifests were promoted without rebuild to `0.1.0` and `latest`, verified equivalent to the immutable accepted digest references, and the stable GitHub Release was published and verified.'
                : 'Stable publication did not complete successfully. Do not mutate or repoint any published stable tag; inspect the run before recovery.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
