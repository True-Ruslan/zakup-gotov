name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Follow SECURITY.md instead.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and why it is incorrect.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence of steps.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.x.y or commit SHA
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web
        - API/backend
        - Database
        - Product matching
        - Basket optimization
        - Retailer/provider integration
        - CI/tooling
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs/screenshots are useful only after removing credentials, tokens, addresses, and other personal data.
